<!DOCTYPE html>
<html>
    <head>
        <title>Pick a new password</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/auth.css">
        <link rel="stylesheet" href="css/nav.css">
    </head>
    <body class="has-site-nav quest-app quest-no-hud quest-entry">

        <a class="page-brand" href="index.html">MindZone</a>

        <nav class="site-nav">
            <div class="nav-links">
                <a class="nav-btn active" href="auth.html">Get Started</a>
            </div>
        </nav>

        <div class="auth-layout">
            <div class="auth-wrapper">
                <div class="auth-card">
                    <div class="card-header">
                        <img src="images/step-signup.jpg" alt="" class="card-thumb">
                        <div>
                            <h2>Pick a new password</h2>
                            <p class="card-sub">Then you're back to your quest.</p>
                        </div>
                    </div>

                    <form id="resetForm" class="auth-form">
                        <label>New password <span class="req">*</span></label>
                        <input id="newPassword" type="password" placeholder="At least 8 characters" required>

                        <label>Type it again <span class="req">*</span></label>
                        <input id="confirmPassword" type="password" placeholder="Same password" required>

                        <button type="submit" class="submit-btn">Save New Password</button>
                    </form>

                    <p id="message"></p>

                    <a class="link-btn" href="auth.html">Back to log in</a>
                </div>
            </div>
        </div>

        <script src="js/reset-password.js"></script>
    </body>
</html>
