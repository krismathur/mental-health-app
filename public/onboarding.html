<!DOCTYPE html>
<html>
    <head>
        <title>Onboarding - MindZone</title>
        <link rel="stylesheet" href="css/onboarding.css">
    </head>
    <body>

        <nav>
            <a class="nav-logo" href="index.html">MindZone</a>
        </nav>

        <div class="page">

            <h1>MindZone</h1>
            <p class="tagline">Train your mind. Elevate your game.</p>

            <div class="card">
                <h2>Create Your Profile</h2>
                <p class="subtitle">Tell us about yourself to get started.</p>

                <form>
                    <label for="name">Name <span class="req">*</span></label>
                    <input id="name" type="text" placeholder="Your name" required>

                    <label for="age">Age <span class="req">*</span></label>
                    <input id="age" type="number" placeholder="Your age" required>

                    <label for="sport">Sport <span class="req">*</span></label>
                    <input id="sport" type="text" placeholder="e.g. Soccer, Basketball" required>

                    <label for="goal">Main Goal <span class="req">*</span></label>
                    <input id="goal" type="text" placeholder="What do you want to improve?" required>

                    <label for="challenge">Biggest Challenge <span class="req">*</span></label>
                    <input id="challenge" type="text" placeholder="What holds you back?" required>

                    <button id="submitBtn" type="submit">Get Started →</button>
                </form>
            </div>

        </div>

        <script src="js/onboarding.js"></script>
    </body>
</html>
